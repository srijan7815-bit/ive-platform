name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: dropdown
    id: platform
    attributes: { label: Platform, options: [Windows, Android] }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: IVE version, placeholder: "1.0.0" }
  - type: textarea
    id: what
    attributes: { label: What happened?, description: Steps to reproduce, expected vs actual }
    validations: { required: true }
