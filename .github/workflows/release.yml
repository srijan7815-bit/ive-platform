name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - run: dotnet test apps/windows/tests/Ive.Core.Tests/Ive.Core.Tests.csproj -c Release
      - run: >
          dotnet publish apps/windows/src/Ive.App/Ive.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out/windows
      - run: Rename-Item out/windows/IVE.exe "IVE-${{ github.ref_name }}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with: { name: win, path: "out/windows/IVE-*.exe" }

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/android } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk "IVE-${{ github.ref_name }}-android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: "apps/android/IVE-*.apk" }

  publish:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
