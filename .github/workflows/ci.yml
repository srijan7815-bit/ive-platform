name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows app (build + test)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit tests (Ive.Core)
        run: |
          dotnet test apps/windows/tests/Ive.Core.Tests/Ive.Core.Tests.csproj -c Release 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"
      - name: Publish single-file exe
        run: |
          dotnet publish apps/windows/src/Ive.App/Ive.App.csproj -c Release -r win-x64 \
            --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -o out/windows 2>&1 | tee -a build.log
          exit "${PIPESTATUS[0]}"
      - name: Surface build errors as annotations
        if: failure()
        run: |
          grep -E "error |Failed |Assert|Error Message" build.log | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:420}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: IVE-windows-x64
          path: out/windows/IVE.exe

  android:
    name: Android app (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + debug APK
        run: |
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --console=plain 2>&1 | tee build.log
          exit "${PIPESTATUS[0]}"
      - name: Surface build errors as annotations
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|What went wrong|Unresolved|Caused by" -A1 build.log | grep -v "^--" | sort -u | head -40 | while IFS= read -r l; do echo "::error::${l:0:420}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: IVE-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
