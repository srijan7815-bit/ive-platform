name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows:
    name: Windows app (build + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Unit tests (Ive.Core)
        run: dotnet test apps/windows/tests/Ive.Core.Tests/Ive.Core.Tests.csproj -c Release
      - name: Publish single-file exe
        run: >
          dotnet publish apps/windows/src/Ive.App/Ive.App.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o out/windows
      - uses: actions/upload-artifact@v4
        with:
          name: IVE-windows-x64
          path: out/windows/IVE.exe

  android:
    name: Android app (build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests + debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: IVE-android-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
